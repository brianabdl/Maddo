[package]
name = "maddo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "maddo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chromiumoxide = "0.9.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
